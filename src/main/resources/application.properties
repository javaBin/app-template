spring.application.name=my-service

# Must match compute.port in app.yaml.
server.port=8080

# The ALB health check (compute.health_check in app.yaml) hits /actuator/health.
# Only the health endpoint is exposed over HTTP; leave it that way unless you
# put the others behind auth.
management.endpoints.web.exposure.include=health

# The container runs as a non-root user with a read-only root filesystem;
# only /tmp is writable. Embedded Tomcat already uses java.io.tmpdir (/tmp).
